<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title> Bank System </title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #eaf3f5;
      --surface: #fff;
      --ink: #12242c;
      --muted: #5a6d76;
      --line: #d3e2e7;
      --teal: #0f8b8d;
      --gold: #e0a010;
      --coral: #ee6a5b;
      --violet: #6a5ae0;
      --green: #2f9d5c;
      --sky: #2f8fe0;
      --pink: #d6479b;
      --h1: #0f8b8d;
      --h2: #6a5ae0;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #0c1a21;
        --surface: #13262f;
        --ink: #e6f1f4;
        --muted: #93aab3;
        --line: #243b46;
        --teal: #2cc3c5;
        --gold: #f2b93b;
        --coral: #ff8577;
        --violet: #9486ff;
        --green: #4cc582;
        --sky: #5eb2ff;
        --pink: #ee74bb;
        --h1: #0b5f66;
        --h2: #3b2f8f
      }
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0c1a21;
      --surface: #13262f;
      --ink: #e6f1f4;
      --muted: #93aab3;
      --line: #243b46;
      --teal: #2cc3c5;
      --gold: #f2b93b;
      --coral: #ff8577;
      --violet: #9486ff;
      --green: #4cc582;
      --sky: #5eb2ff;
      --pink: #ee74bb;
      --h1: '#0b5f66';
      --h2: '#3b2f8f'
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Cairo', system-ui, 'Segoe UI', Tahoma, sans-serif;
      line-height: 1.6;
      transition: background .3s, color .3s
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      background: var(--h1);
      z-index: 10
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 800
    }

    .hb {
      display: flex;
      gap: 8px
    }

    .pillb {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 2px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      padding: 6px 14px;
      border-radius: 999px;
      font: inherit;
      font-weight: 600;
      cursor: pointer
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--violet);
      outline-offset: 2px
    }

    .knob {
      width: 38px;
      height: 20px;
      border-radius: 999px;
      background: var(--gold);
      position: relative;
      transition: background .3s
    }

    .knob::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: transform .3s
    }

    :root[data-theme="dark"] .knob {
      background: var(--violet)
    }

    :root[data-theme="dark"] .knob::after {
      transform: translateX(18px)
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 18px;
      align-items: center;
      padding: 26px;
      border-radius: 24px;
      color: #fff;
      background: linear-gradient(120deg, var(--h1), var(--h2));
      overflow: hidden
    }

    .hero h2 {
      margin: 0 0 4px;
      font-size: 1.1rem;
      font-weight: 600;
      opacity: .9
    }

    .total {
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1.1;
      direction: ltr;
      text-align: start
    }

    .pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px
    }

    .pill {
      background: rgba(255, 255, 255, .18);
      padding: 4px 14px;
      border-radius: 999px;
      font-weight: 600
    }

    .cash {
      --w: min(215px, 42vw);
      display: flex;
      gap: 22px;
      justify-content: center;
      align-items: flex-end;
      direction: ltr
    }

    .stack {
      position: relative;
      width: var(--w);
      height: calc(var(--w)*var(--r) + 46px)
    }

    .usd {
      --r: .42
    }

    .egp {
      --r: .43
    }

    .stack.a {
      transform: rotate(-4deg)
    }

    .stack.b {
      transform: rotate(3deg) translateY(8px)
    }

    .bill {
      position: absolute;
      left: 0;
      width: var(--w);
      height: calc(var(--w)*var(--r));
      border-radius: 3px;
      border: 1px solid rgba(0, 0, 0, .4);
      box-shadow: 0 1px 2px rgba(0, 0, 0, .3)
    }

    .usd .bill {
      background: #c4d8c0
    }

    .egp .bill {
      background: #cdbfd6
    }

    .bill img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 2px;
      object-fit: fill
    }

    .band {
      position: absolute;
      left: 56%;
      width: 15%;
      bottom: 0;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: .62rem;
      font-weight: 800;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .3);
      direction: ltr
    }

    .usd .band {
      background: #7b4fb3
    }

    .egp .band {
      background: #0f8b8d
    }

    .cap {
      position: absolute;
      bottom: -30px;
      left: -10px;
      right: -10px;
      text-align: center;
      font-size: .85rem;
      font-weight: 600;
      white-space: nowrap
    }

    .main {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 18px;
      margin-top: 18px
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px
    }

    .card h3 {
      margin: 0 0 12px;
      font-size: 1.1rem
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px
    }

    .tab {
      border: 2px solid var(--c);
      color: var(--c);
      background: transparent;
      padding: 6px 14px;
      border-radius: 12px;
      font: inherit;
      font-weight: 600;
      cursor: pointer
    }

    .tab[aria-selected="true"] {
      background: var(--c);
      color: #fff
    }

    .fields {
      display: grid;
      gap: 10px
    }

    label {
      display: grid;
      gap: 4px;
      font-weight: 600;
      font-size: .92rem
    }

    input {
      font: inherit;
      padding: 10px 12px;
      border-radius: 12px;
      border: 2px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      width: 100%
    }

    input:focus {
      border-color: var(--accent)
    }

    .go {
      margin-top: 14px;
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 11px;
      font: inherit;
      font-weight: 800;
      color: #fff;
      background: var(--accent);
      cursor: pointer
    }

    .go:hover {
      filter: brightness(1.08)
    }

    .out {
      margin-top: 16px;
      border-radius: 14px;
      padding: 12px 14px;
      background: var(--bg);
      border-inline-start: 6px solid var(--line);
      min-height: 52px
    }

    .out.ok {
      border-color: var(--green)
    }

    .out.bad {
      border-color: var(--coral)
    }

    .out ul {
      margin: 6px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 6px;
      max-height: 220px;
      overflow: auto
    }

    .out li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      background: var(--surface);
      padding: 6px 10px;
      border-radius: 10px
    }

    .stat {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 8px
    }

    .stat div {
      background: var(--surface);
      border-radius: 12px;
      padding: 8px 10px
    }

    .stat b {
      display: block;
      font-size: 1.15rem;
      direction: ltr;
      text-align: start
    }

    .danger {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap
    }

    .danger button {
      flex: 1;
      min-width: 140px;
      background: transparent;
      border: 2px solid var(--c);
      color: var(--c);
      border-radius: 12px;
      padding: 8px;
      font: inherit;
      font-weight: 700;
      cursor: pointer
    }

    .danger button:hover,
    .danger button[data-armed] {
      background: var(--c);
      color: #fff
    }

    .list {
      display: grid;
      gap: 8px;
      max-height: 480px;
      overflow: auto
    }

    .cust {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border: 2px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 14px;
      padding: 9px 12px;
      font: inherit;
      cursor: pointer;
      text-align: start
    }

    .cust:hover {
      border-color: var(--c)
    }

    .cust .id {
      font-weight: 800;
      color: var(--c)
    }

    .cust .bal {
      direction: ltr;
      font-weight: 600
    }

    @media (max-width:820px) {

      .hero,
      .main {
        grid-template-columns: 1fr
      }

      .total {
        font-size: 2.2rem
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <h1 data-i18n="title"></h1>
      <div class="hb">
        <button class="pillb" id="lang" type="button" aria-label="Language">EN</button>
        <button class="pillb" id="theme" type="button"><span id="tl" data-i18n="dark"></span><span
            class="knob"></span></button>
      </div>
    </header>
    <section class="hero">
      <div>
        <h2 data-i18n="total"></h2>
        <div class="total" id="total">0</div>
        <div class="pills"><span class="pill" id="p0"></span><span class="pill" id="p1"></span><span class="pill"
            id="p2"></span></div>
      </div>
      <div class="cash" aria-hidden="true">
        <div class="stack a usd" id="usd"></div>
        <div class="stack b egp" id="egp"></div>
      </div>
    </section>
    <section class="main">
      <div class="card">
        <h3 data-i18n="ops_h"></h3>
        <div class="tabs" id="tabs" role="tablist"></div>
        <div class="fields" id="fields"></div>
        <button class="go" id="go" type="button" data-i18n="go"></button>
        <div class="out" id="out" aria-live="polite"></div>
        <div class="danger">
          <button type="button" id="clr" data-i18n="clr" style="--c:var(--coral)"></button>
          <button type="button" id="rst" data-i18n="rst" style="--c:var(--violet)"></button>
        </div>
      </div>
      <div class="card">
        <h3 data-i18n="list_h"></h3>
        <div class="list" id="list"></div>
      </div>
    </section>
  </div>
  <script>
    const L = {
      ar: {
        title: 'نظام البنك', total: 'إجمالي الأرصدة', dark: 'الوضع الداكن', light: 'الوضع الفاتح', lang: 'EN', ops_h: 'العمليات', list_h: 'العملاء', go: 'نفّذ',
        clr: 'مسح كل العمليات', rst: 'ابدأ من الأول', sure: 'اضغط تاني للتأكيد', hint: 'اختار عملية وانفّذها.',
        c0: 'عدد العملاء: ', c1: 'عمليات: ', c2: 'متوسط الرصيد: ',
        t_add: 'إضافة عميل', t_bal: 'عرض الرصيد', t_dep: 'إيداع', t_wd: 'سحب', t_tr: 'تحويل', t_his: 'سجل العمليات', t_st: 'إحصائيات',
        f_id: 'رقم العميل', f_bal: 'الرصيد الابتدائي', f_dep: 'مبلغ الإيداع', f_wd: 'مبلغ السحب', f_from: 'رقم المرسل', f_to: 'رقم المستلم', f_tr: 'مبلغ التحويل',
        m_added: 'تمت إضافة العميل.', m_badid: 'رقم العميل غير صالح.', m_badbal: 'الرصيد غير صالح.', m_exists: 'العميل موجود بالفعل.', m_nf: 'العميل غير موجود.', m_badamt: 'المبلغ غير صالح.', m_ins: 'الرصيد غير كافٍ.', m_dep: 'تم الإيداع.', m_wd: 'تم السحب.', m_tr: 'تم التحويل.', m_same: 'مينفعش التحويل لنفس الحساب.', m_notx: 'مفيش عمليات لسه.', m_nocust: 'مفيش عملاء.', m_bal: 'الرصيد: ',
        m_cleared: 'تم مسح كل العمليات. الأرصدة زي ما هي.', m_reset: 'رجع كل حاجة لأول مرة.',
        deposit: 'إيداع', withdraw: 'سحب', transfer_out: 'تحويل صادر', transfer_in: 'تحويل وارد',
        s_total: 'إجمالي الأرصدة', s_cnt: 'عدد العملاء', s_min: 'أصغر رقم', s_max: 'أكبر رقم', s_ops: 'عدد العمليات', s_avg: 'متوسط العملية', s_dep: 'الإيداعات', s_wd: 'السحوبات',
        cap_usd: 'رزمة 100 دولار', cap_egp: 'رزمة 200 جنيه'
      },
      en: {
        title: 'Bank System', total: 'Total balances', dark: 'Dark mode', light: 'Light mode', lang: 'عربي', ops_h: 'Operations', list_h: 'Customers', go: 'Run',
        clr: 'Clear all transactions', rst: 'Start over', sure: 'Click again to confirm', hint: 'Pick an operation and run it.',
        c0: 'Customers: ', c1: 'Transactions: ', c2: 'Average balance: ',
        t_add: 'Add customer', t_bal: 'Show balance', t_dep: 'Deposit', t_wd: 'Withdraw', t_tr: 'Transfer', t_his: 'History', t_st: 'Statistics',
        f_id: 'Customer ID', f_bal: 'Initial balance', f_dep: 'Deposit amount', f_wd: 'Withdrawal amount', f_from: 'Sender ID', f_to: 'Receiver ID', f_tr: 'Transfer amount',
        m_added: 'Customer added.', m_badid: 'Invalid customer ID.', m_badbal: 'Invalid balance.', m_exists: 'Customer already exists.', m_nf: 'Customer not found.', m_badamt: 'Invalid amount.', m_ins: 'Insufficient balance.', m_dep: 'Deposit successful.', m_wd: 'Withdrawal successful.', m_tr: 'Transfer successful.', m_same: 'Cannot transfer to the same account.', m_notx: 'No transactions yet.', m_nocust: 'No customers found.', m_bal: 'Balance: ',
        m_cleared: 'All transactions cleared. Balances are unchanged.', m_reset: 'Everything is back to the starting state.',
        deposit: 'Deposit', withdraw: 'Withdraw', transfer_out: 'Transfer out', transfer_in: 'Transfer in',
        s_total: 'Total balances', s_cnt: 'Customers', s_min: 'Smallest ID', s_max: 'Largest ID', s_ops: 'Transactions', s_avg: 'Average transaction', s_dep: 'Deposits', s_wd: 'Withdrawals',
        cap_usd: '$100 bundle', cap_egp: '200 EGP bundle'
      }
    };
    let lang = 'ar'; const t = k => L[lang][k]; const $ = id => document.getElementById(id);
    const fmt = n => Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 });

    class Bank {
      constructor(l) { this.c = []; this.tx = []; (l || []).forEach(i => { const id = String(i.id ?? '').trim(), b = this.v(i.balance ?? 0); if (id && b !== null && b >= 0 && !this.find(id)) this.c.push({ id, balance: b }) }) }
      v(a) { if (String(a).trim() === '') return null; const n = Number(a); return Number.isFinite(n) ? n : null }
      find(id) { return this.c.find(x => x.id === String(id).trim()) || null }
      add(id, b) { id = String(id).trim(); b = this.v(b === '' ? 0 : b); if (!id) return [0, 'm_badid']; if (b === null || b < 0) return [0, 'm_badbal']; if (this.find(id)) return [0, 'm_exists']; this.c.push({ id, balance: b }); return [1, 'm_added'] }
      bal(id) { const c = this.find(id); return c ? [1, 'm_bal', fmt(c.balance)] : [0, 'm_nf'] }
      dep(id, a) { const c = this.find(id); a = this.v(a); if (!c) return [0, 'm_nf']; if (a === null || a <= 0) return [0, 'm_badamt']; c.balance += a; this.tx.push({ type: 'deposit', cid: c.id, amount: a }); return [1, 'm_dep'] }
      wd(id, a) { const c = this.find(id); a = this.v(a); if (!c) return [0, 'm_nf']; if (a === null || a <= 0) return [0, 'm_badamt']; if (c.balance < a) return [0, 'm_ins']; c.balance -= a; this.tx.push({ type: 'withdraw', cid: c.id, amount: a }); return [1, 'm_wd'] }
      tr(s, r, a) { const x = this.find(s), y = this.find(r); a = this.v(a); if (!x || !y) return [0, 'm_nf']; if (x.id === y.id) return [0, 'm_same']; if (a === null || a <= 0) return [0, 'm_badamt']; if (x.balance < a) return [0, 'm_ins']; x.balance -= a; y.balance += a; this.tx.push({ type: 'transfer_out', cid: x.id, amount: a, o: y.id }, { type: 'transfer_in', cid: y.id, amount: a, o: x.id }); return [1, 'm_tr'] }
      his(id) { if (!this.find(id)) return [0, 'm_nf']; const h = this.tx.filter(x => x.cid === String(id).trim()); return h.length ? [1, '', { h }] : [0, 'm_notx'] }
      st() {
        if (!this.c.length) return [0, 'm_nocust']; const s = [...this.c].sort((x, y) => { const a = /^\d+$/.test(x.id), b = /^\d+$/.test(y.id); if (a && b) return x.id - y.id; if (a !== b) return a ? -1 : 1; return x.id < y.id ? -1 : x.id > y.id ? 1 : 0 });
        const n = this.tx.length, avg = n ? this.tx.reduce((q, x) => q + x.amount, 0) / n : null;
        return [1, '', { s: [['s_total', fmt(this.c.reduce((q, x) => q + x.balance, 0))], ['s_cnt', this.c.length], ['s_min', s[0].id], ['s_max', s[s.length - 1].id], ['s_ops', n], ['s_avg', avg === null ? '—' : fmt(avg)], ['s_dep', this.tx.filter(x => x.type === 'deposit').length], ['s_wd', this.tx.filter(x => x.type === 'withdraw').length]] }]
      }
    }
    const INIT = [{ id: '12', balance: 1000 }, { id: '44', balance: 2500 }, { id: '55', balance: 500 }, { id: '60', balance: 3000 }, { id: '70', balance: 1500 }, { id: '80', balance: 4000 }];
    let bank = new Bank(INIT), last = null;

    const ops = [
      { t: 't_add', c: '--teal', f: [['id', 'f_id'], ['b', 'f_bal']], run: v => bank.add(v.id, v.b) },
      { t: 't_bal', c: '--sky', f: [['id', 'f_id']], run: v => bank.bal(v.id) },
      { t: 't_dep', c: '--green', f: [['id', 'f_id'], ['a', 'f_dep']], run: v => bank.dep(v.id, v.a) },
      { t: 't_wd', c: '--coral', f: [['id', 'f_id'], ['a', 'f_wd']], run: v => bank.wd(v.id, v.a) },
      { t: 't_tr', c: '--violet', f: [['s', 'f_from'], ['r', 'f_to'], ['a', 'f_tr']], run: v => bank.tr(v.s, v.r, v.a) },
      { t: 't_his', c: '--gold', f: [['id', 'f_id']], run: v => bank.his(v.id) },
      { t: 't_st', c: '--pink', f: [], run: () => bank.st() }];
    let cur = ops[0];

    function tabs() { $('tabs').innerHTML = ''; ops.forEach(o => { const b = document.createElement('button'); b.className = 'tab'; b.type = 'button'; b.role = 'tab'; b.textContent = t(o.t); b.style.setProperty('--c', 'var(' + o.c + ')'); b.setAttribute('aria-selected', o === cur); b.onclick = () => { cur = o; last = null; tabs(); fields(); out() }; $('tabs').appendChild(b) }) }
    function fields(keep) {
      document.documentElement.style.setProperty('--accent', 'var(' + cur.c + ')');
      $('fields').innerHTML = cur.f.map(([n, l]) => `<label>${t(l)}<input data-n="${n}" autocomplete="off" inputmode="${/^[ab]$/.test(n) ? 'decimal' : 'text'}" value="${(keep && keep[n] || '').replace(/"/g, '&quot;')}"></label>`).join('');
      document.querySelectorAll('#fields input').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') run() })
    }
    function vals() { const v = {}; document.querySelectorAll('#fields input').forEach(i => v[i.dataset.n] = i.value); return v }
    function run() { last = cur.run(vals()); out(); paint() }
    function out() {
      const o = $('out'); if (!last) { o.className = 'out'; o.textContent = t('hint'); return }
      const [ok, k, d] = last; o.className = 'out ' + (ok ? 'ok' : 'bad');
      let h = k ? `<div>${t(k)}${k === 'm_bal' ? `<b dir="ltr">${d}</b>` : ''}</div>` : '';
      if (d && d.h) h += '<ul>' + d.h.map(x => `<li><span>${t(x.type)}${x.o ? ' (' + x.o + ')' : ''}</span><b dir="ltr">${fmt(x.amount)}</b></li>`).join('') + '</ul>';
      if (d && d.s) h += '<div class="stat">' + d.s.map(s => `<div>${t(s[0])}<b>${s[1]}</b></div>`).join('') + '</div>';
      o.innerHTML = h
    }
    $('go').onclick = run;

    const pal = ['--teal', '--violet', '--coral', '--gold', '--green', '--sky', '--pink'];
    function paint() {
      const tot = bank.c.reduce((s, c) => s + c.balance, 0), n = bank.c.length;
      $('total').textContent = fmt(tot); $('p0').textContent = t('c0') + n; $('p1').textContent = t('c1') + bank.tx.length; $('p2').textContent = t('c2') + fmt(n ? tot / n : 0);
      $('list').innerHTML = ''; bank.c.forEach((c, i) => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'cust'; b.style.setProperty('--c', 'var(' + pal[i % 7] + ')');
        b.innerHTML = `<span class="id"></span><span class="bal">${fmt(c.balance)}</span>`; b.firstChild.textContent = c.id;
        b.onclick = () => { const f = document.querySelector('#fields input'); if (f) { f.value = c.id; f.focus() } }; $('list').appendChild(b)
      })
    }

    // two-step confirm for the destructive buttons
    function arm(b, fn) {
      if (b.dataset.armed) { clearTimeout(b._t); delete b.dataset.armed; b.textContent = t(b.dataset.i18n); fn(); return }
      b.dataset.armed = 1; b.textContent = t('sure'); b._t = setTimeout(() => { delete b.dataset.armed; b.textContent = t(b.dataset.i18n) }, 3000)
    }
    $('clr').onclick = e => arm(e.currentTarget, () => { bank.tx = []; last = [1, 'm_cleared']; out(); paint() });
    $('rst').onclick = e => arm(e.currentTarget, () => { bank = new Bank(INIT); cur = ops[0]; last = [1, 'm_reset']; tabs(); fields(); out(); paint() });

    function stack(el, src, alt) {
      let h = ''; const n = 7, s = 6;
      for (let i = 0; i < n; i++)h += `<div class="bill" style="bottom:${i * s}px"></div>`;
      h += `<div class="bill" style="bottom:${n * s}px"><img src="${src}" alt="${alt}"></div>`;
      el.innerHTML = h
    }
    function stacks() { stack($('usd'), USD, '100 USD'); stack($('egp'), EGP, '200 EGP') }

    // ---- language + theme ----
    function applyLang() {
      const d = document.documentElement; d.lang = lang; d.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.querySelectorAll('[data-i18n]').forEach(e => { if (!e.dataset.armed) e.textContent = t(e.dataset.i18n) });
      $('lang').textContent = t('lang'); document.title = t('title');
      const k = vals(); tabs(); fields(k); out(); paint(); stacks();
      try { localStorage.setItem('bank-lang', lang) } catch (e) { }
    }
    $('lang').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; applyLang() };
    const root = document.documentElement;
    const isDark = () => root.dataset.theme === 'dark';
    function themeLabel() { $('tl').dataset.i18n = isDark() ? 'light' : 'dark'; $('tl').textContent = t(isDark() ? 'light' : 'dark') }
    try { const s = localStorage.getItem('bank-lang'); if (s === 'en' || s === 'ar') lang = s } catch (e) { }
    let th = null; try { th = localStorage.getItem('bank-theme') } catch (e) { }
    root.dataset.theme = th || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    $('theme').onclick = () => { const n = isDark() ? 'light' : 'dark'; root.dataset.theme = n; try { localStorage.setItem('bank-theme', n) } catch (e) { } themeLabel() };
    themeLabel(); applyLang();
  </script>
